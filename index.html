<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivial du week-end</title>
<style>
  :root{
    --bg:#0f172a; --bg2:#1e293b; --card:#f8fafc; --ink:#0f172a; --muted:#64748b;
    --teamA:#2563eb; --teamB:#e11d48;
    --hist:#f59e0b; --geo:#3b82f6; --jardin:#22c55e; --cine:#ec4899; --sport:#f97316; --random:#8b5cf6;
    --ok:#16a34a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 800px at 20% -10%,#1e3a8a 0%,var(--bg) 55%);color:#e2e8f0;line-height:1.4}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  h1{font-size:clamp(28px,5vw,54px);margin:0 0 6px;letter-spacing:-.02em}
  h2{font-size:clamp(20px,3vw,30px);margin:0 0 12px}
  p{margin:0 0 10px}
  .muted{color:#94a3b8}
  button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 22px;font-size:clamp(16px,2vw,20px);font-weight:700;transition:transform .08s,filter .15s;color:#fff;background:#334155}
  button:hover{filter:brightness(1.1)} button:active{transform:scale(.97)}
  button.primary{background:#fbbf24;color:#1f1300}
  button.ghost{background:transparent;border:2px solid #475569;color:#cbd5e1}
  button.teamA{background:var(--teamA)} button.teamB{background:var(--teamB)}
  button.none{background:#475569}
  button:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .grow{flex:1}

  /* scoreboard */
  .scorebar{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin-bottom:18px}
  .team{border-radius:18px;padding:12px 18px;background:var(--bg2);display:flex;align-items:center;gap:14px;border:3px solid transparent}
  .team.A{border-color:var(--teamA)} .team.B{border-color:var(--teamB);flex-direction:row-reverse;text-align:right}
  .team .name{font-weight:800;font-size:clamp(16px,2.2vw,24px);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .team .pts{font-size:clamp(30px,5vw,54px);font-weight:900;line-height:1}
  .wedges{display:flex;gap:4px;margin-top:4px}
  .team.B .wedges{justify-content:flex-end}
  .wedge{width:14px;height:14px;border-radius:50%;background:#334155;opacity:.35}
  .wedge.on{opacity:1}
  .progress{display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:800;color:#94a3b8;font-size:clamp(14px,1.6vw,18px);padding:0 8px;white-space:nowrap}
  .progress b{color:#fff;font-size:clamp(18px,2.4vw,26px)}

  /* card */
  .card{background:var(--card);color:var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.45)}
  .hero{position:relative;min-height:230px;display:flex;align-items:center;justify-content:center;gap:18px;padding:28px;overflow:hidden}
  .hero .emo{font-size:clamp(70px,12vw,130px);line-height:1;filter:drop-shadow(0 12px 20px rgba(0,0,0,.25));animation:pop .5s ease}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .hero::before{content:"";position:absolute;inset:-40%;background:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 18px,transparent 18px 36px)}
  .badge{position:absolute;top:16px;left:16px;background:rgba(0,0,0,.35);color:#fff;font-weight:800;padding:8px 14px;border-radius:999px;font-size:clamp(13px,1.6vw,17px);letter-spacing:.04em;text-transform:uppercase;backdrop-filter:blur(4px)}
  .stake{position:absolute;top:16px;right:16px;background:#fff;color:#111;font-weight:900;padding:8px 14px;border-radius:999px;font-size:clamp(13px,1.6vw,17px)}
  .body{padding:26px 30px 30px}
  .q{font-size:clamp(22px,3.2vw,36px);font-weight:800;letter-spacing:-.01em;margin-bottom:18px}
  .hint{font-size:clamp(14px,1.7vw,18px);color:var(--muted);margin-bottom:16px}
  .answer{background:#ecfdf5;border:2px solid #16a34a;border-radius:16px;padding:16px 20px;margin:12px 0 16px;animation:pop .35s ease}
  .answer .a{font-size:clamp(22px,3vw,34px);font-weight:900;color:#065f46}
  .answer .n{font-size:clamp(14px,1.7vw,18px);color:#334155;margin-top:6px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 16px}
  @media(max-width:640px){.choices{grid-template-columns:1fr}}
  .choice{background:#f1f5f9;border:3px solid #e2e8f0;border-radius:16px;padding:16px 18px;font-size:clamp(18px,2.4vw,26px);font-weight:700;display:flex;gap:12px;align-items:center;animation:pop .35s ease}
  .choice .k{width:38px;height:38px;border-radius:10px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
  .choice.good{background:#dcfce7;border-color:#16a34a}
  .choice.good .k{background:#16a34a}
  .choice.bad{opacity:.4}
  .attr{border-top:2px dashed #e2e8f0;padding-top:16px;margin-top:6px}
  .attr .lab{font-weight:800;color:var(--muted);margin-bottom:10px;text-transform:uppercase;font-size:14px;letter-spacing:.06em}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#fff;color:#111;font-weight:800;padding:12px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}

  /* intro */
  .intro .card{padding:30px}
  .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0 24px}
  .rule{background:#f1f5f9;border-radius:16px;padding:16px}
  .rule .ic{font-size:34px;margin-bottom:6px}
  .rule b{display:block;font-size:18px;margin-bottom:4px}
  .rule p{color:#475569;font-size:15px}
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
  @media(max-width:640px){.teams{grid-template-columns:1fr}}
  .tin{border-radius:16px;padding:16px;border:3px solid}
  .tin.A{border-color:var(--teamA)} .tin.B{border-color:var(--teamB)}
  .tin label{display:block;font-weight:800;margin-bottom:8px}
  .tin input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid #cbd5e1}
  .cats{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
  .cat{padding:6px 12px;border-radius:999px;color:#fff;font-weight:800;font-size:14px}
  .footer{margin-top:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;color:#64748b;font-size:14px}

  /* end */
  .end .card{padding:34px;text-align:center}
  .winner{font-size:clamp(28px,5vw,56px);font-weight:900;margin:8px 0 18px}
  .recap{text-align:left;margin:22px auto 0;max-width:720px;border-top:2px dashed #e2e8f0;padding-top:14px}
  .recap div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:16px}
  .recap .who{font-weight:800;white-space:nowrap}
  .who.A{color:var(--teamA)} .who.B{color:var(--teamB)} .who.none{color:#94a3b8}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
  .topbar .t{font-weight:900;font-size:18px;color:#cbd5e1}
  .small{font-size:14px;padding:8px 14px;border-radius:10px}

  /* curseurs */
  .sliders{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:6px 0 18px}
  @media(max-width:720px){.sliders{grid-template-columns:1fr}}
  .sl{border:3px solid;border-radius:18px;padding:16px;background:#fff}
  .sl.A{border-color:var(--teamA)} .sl.B{border-color:var(--teamB)}
  .sl .h{font-weight:900;font-size:18px;margin-bottom:4px}
  .sl.A .h{color:var(--teamA)} .sl.B .h{color:var(--teamB)}
  .sl .vv{font-size:clamp(36px,5vw,58px);font-weight:900;text-align:center;margin:2px 0 6px;font-variant-numeric:tabular-nums}
  .sl input[type=range]{width:100%;height:36px}
  .sl.A input[type=range]{accent-color:var(--teamA)} .sl.B input[type=range]{accent-color:var(--teamB)}
  .steps{display:flex;gap:6px;justify-content:center;align-items:center;margin:8px 0 12px;flex-wrap:wrap}
  .stepb{padding:8px 12px;font-size:16px;border-radius:10px;background:#e2e8f0;color:#0f172a}
  .steps input[type=number]{width:110px;font:inherit;font-size:18px;padding:8px;border-radius:10px;border:2px solid #cbd5e1;text-align:center}
  .sl .lockb{width:100%}
  .sl.A .lockb{background:var(--teamA)} .sl.B .lockb{background:var(--teamB)}
  .sl.locked{background:#f8fafc}
  .sl.locked .vv{font-size:48px}
  .axis{position:relative;height:120px;margin:10px 44px 8px}
  .axis .track{position:absolute;top:50%;left:0;right:0;height:10px;border-radius:5px;background:#e2e8f0;transform:translateY(-50%)}
  .axis .mk{position:absolute;top:50%;width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);transform:translate(-50%,-50%);animation:pop .4s ease}
  .axis .mk.A{background:var(--teamA)} .axis .mk.B{background:var(--teamB)}
  .axis .mk span{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:900;font-size:16px}
  .axis .mk.A span{bottom:30px;color:var(--teamA)} .axis .mk.B span{top:30px;color:var(--teamB)}
  .axis .mk.ans{width:8px;height:84px;border-radius:4px;background:#16a34a;border:0;z-index:2}
  .gaps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 10px}
  .gap{border-radius:14px;padding:10px 14px;font-weight:800;font-size:clamp(15px,1.9vw,19px);background:#f1f5f9}
  .gap.A{color:var(--teamA)} .gap.B{color:var(--teamB)}
  .gap.win{outline:3px solid #16a34a;background:#dcfce7}
  .verdict{font-size:clamp(20px,2.8vw,30px);font-weight:900;margin:8px 0 4px}
  .testbanner{background:#fef3c7;border:2px solid #f59e0b;color:#78350f;border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:14px;font-size:clamp(14px,1.7vw,17px)}
  .who.both{color:#7c3aed}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>

// ---------- DONNÉES ----------
const CATS = {
  hist:   {label:"Histoire de France", color:"var(--hist)",   grad:"linear-gradient(135deg,#f59e0b,#b45309)"},
  geofr:  {label:"Géographie française", color:"var(--geo)",  grad:"linear-gradient(135deg,#60a5fa,#1d4ed8)"},
  geoint: {label:"Géographie du monde", color:"var(--geo)",   grad:"linear-gradient(135deg,#38bdf8,#0369a1)"},
  jardin: {label:"Côté jardin", color:"var(--jardin)",        grad:"linear-gradient(135deg,#4ade80,#15803d)"},
  cine:   {label:"Cinéma", color:"var(--cine)",               grad:"linear-gradient(135deg,#f472b6,#be185d)"},
  sport:  {label:"Sport", color:"var(--sport)",               grad:"linear-gradient(135deg,#fb923c,#c2410c)"},
  random: {label:"Random", color:"var(--random)",             grad:"linear-gradient(135deg,#a78bfa,#6d28d9)"},
};
const WEDGE_CATS = ["hist","geofr","geoint","jardin","cine","sport","random"];

// Chaque question : emo (image), q, et soit (a texte + choices + good) soit (num + a nombre). note = anecdote.
// ÉCHAUFFEMENT : 2 questions test qui ne comptent pas
const WARMUP = [
  {cat:"sport", sub:"Test chiffré", emo:["🚴","🟡"], q:"En quelle année a été couru le tout premier Tour de France ?",
   num:{min:1850,max:1970,step:1,unit:""}, a:1903,
   note:"Organisé par le journal L'Auto d'Henri Desgrange pour doper ses ventes. 6 étapes, 2 428 km, remporté par Maurice Garin."},
  {cat:"geofr", sub:"Test réponse", emo:["🧱","🌹"], q:"Quelle ville est surnommée la « Ville rose » ?",
   a:"Toulouse", choices:["Albi","Toulouse","Montauban","Carcassonne"], good:1,
   note:"Pour la couleur des briques de terre cuite de ses bâtiments anciens, faute de pierre dans la plaine de la Garonne."},
];

const QUESTIONS = [
  {cat:"hist", sub:"Date", emo:["⚔️","🏰"], q:"En quelle année Philippe le Bel fait-il arrêter, au petit matin d'un vendredi 13 octobre, tous les Templiers du royaume ?",
   num:{min:1000,max:1500,step:1,unit:""}, a:1307,
   note:"Le vendredi 13 octobre 1307. Une légende tenace y voit l'origine de la superstition du vendredi 13, sans preuve historique. Le grand maître Jacques de Molay sera brûlé sept ans plus tard, en 1314, sur l'île aux Juifs à Paris."},
  {cat:"hist", sub:"Personnage", emo:["🎩","🏛️"], q:"Qui fut le premier président de la IIIe République, élu en 1871 ?",
   a:"Adolphe Thiers", choices:["Léon Gambetta","Jules Grévy","Adolphe Thiers","Patrice de Mac Mahon"], good:2,
   note:"Chef du pouvoir exécutif en février 1871, il reçoit le titre de président de la République par la loi Rivet du 31 août 1871. Mac Mahon lui succède en 1873."},
  {cat:"hist", sub:"Événement", emo:["👑","📜"], q:"Quel traité de 843 partage l'empire carolingien entre les trois petits-fils de Charlemagne ?",
   a:"Le traité de Verdun", choices:["Le traité d'Aix-la-Chapelle","Le traité de Verdun","Le traité de Meerssen","Le traité de Coulaines"], good:1,
   note:"Charles le Chauve reçoit la Francie occidentale (future France), Louis le Germanique la Francie orientale, Lothaire la Francie médiane et le titre impérial."},
  {cat:"geofr", sub:"Département", emo:["🏔️","💧"], q:"Quelle est la préfecture des Alpes-de-Haute-Provence (04) ?",
   a:"Digne-les-Bains", choices:["Manosque","Sisteron","Gap","Digne-les-Bains"], good:3,
   note:"Manosque est pourtant la ville la plus peuplée du département. Gap est la préfecture des Hautes-Alpes. Le département s'appelait Basses-Alpes jusqu'en 1970."},
  {cat:"geofr", sub:"Cours d'eau", emo:["🌊","🦆"], q:"Quel est le plus long affluent de la Loire, avec environ 420 km ?",
   a:"L'Allier", choices:["Le Cher","L'Allier","La Vienne","La Sarthe"], good:1,
   note:"Il naît en Lozère au Moure de la Gardille et rejoint la Loire au Bec d'Allier, près de Nevers. Le Cher fait 368 km, la Vienne 363 km."},
  {cat:"geoint", sub:"Capitale", emo:["🌍","🕌"], q:"De quel pays Achgabat est-elle la capitale ?",
   a:"Le Turkménistan", choices:["Le Kirghizistan","Le Tadjikistan","Le Turkménistan","L'Ouzbékistan"], good:2,
   note:"Ville reconstruite en marbre blanc, elle détient le record Guinness de la plus forte concentration de bâtiments en marbre blanc au monde."},
  {cat:"jardin", sub:"Insecte", emo:["🪲","🌳"], q:"Le grillon chante en frottant ses élytres. Comment la cigale mâle produit-elle, elle, son chant ?",
   a:"En faisant vibrer des membranes de son abdomen (les cymbales)", choices:["En frottant ses pattes arrière contre ses ailes","En faisant vibrer des membranes de son abdomen","En expulsant de l'air par ses stigmates","En claquant ses mandibules"], good:1,
   note:"Ces membranes, les cymbales ou tymbales, se déforment plusieurs centaines de fois par seconde. Seul le mâle chante. La larve vit sous terre plusieurs années avant l'été où elle sort."},
  {cat:"jardin", sub:"Fleur", emo:["🌸","🧡"], q:"De quelle fleur récolte-t-on les stigmates pour produire le safran ?",
   a:"Le crocus (Crocus sativus)", choices:["Le lys","Le colchique","L'iris","Le crocus"], good:3,
   note:"Trois stigmates par fleur, environ 150 000 fleurs pour un kilo de safran, cueillies à la main en octobre. Attention au colchique, son sosie, qui est toxique."},
  {cat:"cine", sub:"Cannes", emo:["🎬","🌴"], q:"Quelle réalisatrice a été la première femme à remporter la Palme d'or, en 1993 ?",
   a:"Jane Campion (La Leçon de piano)", choices:["Agnès Varda","Sofia Coppola","Jane Campion","Julia Ducournau"], good:2,
   note:"Palme partagée cette année-là avec Adieu ma concubine de Chen Kaige. Il faudra attendre 2021 pour une deuxième réalisatrice (Julia Ducournau, Titane), puis 2023 (Justine Triet, Anatomie d'une chute)."},
  {cat:"cine", sub:"César", emo:["🏆","🎭"], q:"Quelle actrice détient le record de César de la meilleure actrice, avec cinq trophées ?",
   a:"Isabelle Adjani", choices:["Catherine Deneuve","Isabelle Huppert","Isabelle Adjani","Juliette Binoche"], good:2,
   note:"Possession (1982), L'Été meurtrier (1984), Camille Claudel (1989), La Reine Margot (1995), La Journée de la jupe (2010). Deneuve et Huppert en ont deux, Binoche un."},
  {cat:"sport", sub:"Football", emo:["⚽","🇫🇷"], q:"Quel Français détient toujours le record de buts marqués dans une seule Coupe du monde, avec 13 buts en 1958 ?",
   a:"Just Fontaine", choices:["Raymond Kopa","Roger Piantoni","Thierry Henry","Just Fontaine"], good:3,
   note:"13 buts en 6 matchs, dont 4 contre l'Allemagne pour la 3e place. Le record n'a jamais été approché : Kocsis 11 en 1954, Gerd Müller 10 en 1970."},
  {cat:"sport", sub:"Rugby", emo:["🏉","🇮🇹"], q:"Dans le Tournoi des Six Nations, quel trophée se disputent la France et l'Italie ?",
   a:"Le trophée Giuseppe-Garibaldi", choices:["La Calcutta Cup","Le trophée Giuseppe-Garibaldi","Le Millennium Trophy","La Centenary Quaich"], good:1,
   note:"Créé en 2007 pour le bicentenaire de la naissance de Garibaldi, né à Nice, et dessiné par Jean-Pierre Rives. Calcutta Cup = Angleterre-Écosse, Millennium Trophy = Angleterre-Irlande, Centenary Quaich = Irlande-Écosse."},
  {cat:"random", sub:"Typographie", emo:["🔣","✍️"], q:"Comment s'appelle le signe typographique « & » ?",
   a:"L'esperluette", choices:["L'obèle","Le pied-de-mouche","L'esperluette","L'octothorpe"], good:2,
   note:"C'est une ligature du latin « et ». L'obèle est le †, le pied-de-mouche le ¶ et l'octothorpe le #. En anglais, le & a longtemps été récité comme 27e lettre de l'alphabet."},
  {cat:"random", sub:"Jeux", emo:["🔠","🎲"], q:"Combien de cases compte un plateau de Scrabble ?",
   num:{min:50,max:500,step:1,unit:"cases"}, a:225,
   note:"Un carré de 15 × 15, dont 61 cases à prime. Le jeu a été inventé en 1938 par l'architecte américain Alfred Butts, au chômage pendant la Grande Dépression."},
];

const TIEBREAK = {cat:"sport", sub:"Gymnastique · subsidiaire", emo:["🤸","🔟"], q:"En quelle année Nadia Comaneci obtient-elle le premier 10 parfait de l'histoire de la gymnastique olympique ?",
   num:{min:1920,max:2020,step:1,unit:""}, a:1976,
   note:"Aux Jeux de Montréal, aux barres asymétriques, à 14 ans. Le tableau d'affichage, prévu pour 3 chiffres, affiche 1.00 faute de pouvoir écrire 10.00."};

const PTS_OPEN = 2, PTS_MCQ = 1, PTS_NUM = 2, PTS_NUM_TIE = 1;

// ---------- ÉTAT ----------
const KEY = "trivial-weekend-v2";
let S = load() || fresh();
function fresh(){ return {screen:"intro", prev:null, names:{A:"Équipe A",B:"Équipe B"}, warm:0, i:0, phase:null, results:[], tie:false, num:null}; }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); return s && s.screen ? s : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function curQ(){ if(S.warm!==null) return WARMUP[S.warm]; return S.tie ? TIEBREAK : QUESTIONS[S.i]; }
function enterQ(){ const Q = curQ(); S.phase = Q.num ? "num" : "open"; S.num = Q.num ? {A:Q.num.min, B:Q.num.min, lockA:false, lockB:false} : null; }
function fmt(x,Q){ return String(x) + (Q.num.unit ? " " + Q.num.unit : ""); }
function ansText(Q){ return Q.num ? fmt(Q.a,Q) : Q.a; }
function gets(r,t){ return r.team===t || r.team==="both"; }
function score(t){ return S.results.reduce((n,r)=> n + (gets(r,t) ? r.pts : 0), 0); }
function wedges(t){ const set = new Set(); S.results.forEach(r=>{ if(gets(r,t) && r.pts>0 && !r.tie) set.add(QUESTIONS[r.i].cat); }); return set; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }

// ---------- RENDU ----------
const app = document.getElementById("app");
function render(){ save(); ({intro:renderIntro, play:renderPlay, ready:renderReady, end:renderEnd})[S.screen](); window.scrollTo({top:0}); }

function renderIntro(){
  app.className = "intro";
  const cats = Object.entries(CATS).map(([k,c])=>`<span class="cat" style="background:${c.color}">${c.label}</span>`).join("");
  app.innerHTML = `
    <h1>🧀 Trivial du week-end</h1>
    <p class="muted" style="font-size:18px;margin-bottom:18px">2 questions test, puis 14 questions, 2 équipes, niveau relevé. Personne ne connaît les réponses à l'avance, pas même le maître du jeu.</p>
    <div class="card">
      <h2>Comment ça marche</h2>
      <div class="rules">
        <div class="rule"><div class="ic">🧪</div><b>Échauffement</b><p>On commence par 2 questions test qui ne comptent pas : une question à réponse, une question chiffrée. Le temps de comprendre le mécanisme.</p></div>
        <div class="rule"><div class="ic">💬</div><b>Question à réponse : ${PTS_OPEN} pts puis ${PTS_MCQ} pt</b><p>Une équipe sûre d'elle annonce sa réponse, on dévoile : ${PTS_OPEN} pts si juste. Personne ne sait ? On affiche 4 propositions, chaque équipe choisit une lettre : ${PTS_MCQ} pt.</p></div>
        <div class="rule"><div class="ic">🎚️</div><b>Question chiffrée : au plus proche</b><p>Date, taille, nombre : chaque équipe règle son curseur à l'abri des regards puis verrouille. On révèle : l'équipe la plus proche prend ${PTS_NUM} pts. Même écart : ${PTS_NUM_TIE} pt chacune.</p></div>
        <div class="rule"><div class="ic">⚖️</div><b>Attribution et égalité</b><p>Le maître du jeu attribue chaque question (bouton « Corriger » pour annuler). Égalité finale : question subsidiaire chiffrée. Scores sauvegardés dans le navigateur.</p></div>
      </div>
      <h2>Les catégories</h2>
      <div class="cats">${cats}</div>
      <p style="color:#475569;margin-bottom:22px">3 histoire de France · 2 géographie française · 1 géographie du monde · 2 côté jardin · 2 cinéma · 2 sport · 2 random</p>
      <h2>Qui est qui ?</h2>
      <div class="teams">
        <div class="tin A"><label>Équipe A (bleu)</label><input id="nA" value="${esc(S.names.A)}" placeholder="Nom de l'équipe A"></div>
        <div class="tin B"><label>Équipe B (rouge)</label><input id="nB" value="${esc(S.names.B)}" placeholder="Nom de l'équipe B"></div>
      </div>
      <div class="row">
        <button class="primary" id="start">${S.prev ? "Nouvelle partie" : "C'est parti"} 🎲</button>
        ${S.prev ? `<button class="ghost" id="resume">Reprendre la partie en cours</button>` : ""}
      </div>
    </div>`;
  const readNames = ()=>{ S.names.A = document.getElementById("nA").value.trim() || "Équipe A"; S.names.B = document.getElementById("nB").value.trim() || "Équipe B"; };
  document.getElementById("start").onclick = ()=>{
    if(S.prev && S.results.length && !confirm("Effacer la partie en cours et recommencer ?")) return;
    readNames(); const n = S.names; S = fresh(); S.names = n; S.screen = "play"; S.prev = "play"; enterQ(); render();
  };
  const r = document.getElementById("resume"); if(r) r.onclick = ()=>{ readNames(); S.screen = S.prev; render(); };
}

function scorebar(){
  const w = t => WEDGE_CATS.map(c=>`<span class="wedge ${wedges(t).has(c)?"on":""}" style="background:${CATS[c].color}" title="${CATS[c].label}"></span>`).join("");
  const label = S.screen==="end" ? "Fin de partie" : S.screen==="ready" ? "Prêts ?" : S.warm!==null ? `Test <b>${S.warm+1}</b> / ${WARMUP.length}` : S.tie ? "Subsidiaire" : `Question <b>${S.i+1}</b> / ${QUESTIONS.length}`;
  return `<div class="scorebar">
    <div class="team A"><div class="pts">${score("A")}</div><div class="grow"><div class="name">${esc(S.names.A)}</div><div class="wedges">${w("A")}</div></div></div>
    <div class="progress">${label}</div>
    <div class="team B"><div class="pts">${score("B")}</div><div class="grow"><div class="name">${esc(S.names.B)}</div><div class="wedges">${w("B")}</div></div></div>
  </div>`;
}

function topbar(){
  return `<div class="topbar"><div class="t">🧀 Trivial du week-end</div><div class="row"><button class="ghost small" data-act="undo" ${S.results.length?"":"disabled"}>↩︎ Corriger la dernière attribution</button><button class="ghost small" data-act="home">Accueil</button></div></div>`;
}

function renderPlay(){
  app.className = "play";
  const Q = curQ(), C = CATS[Q.cat], ph = S.phase, warm = S.warm!==null;
  const stake = Q.num ? `${PTS_NUM} pts · au plus proche` : (ph==="open"||ph==="open-revealed") ? `${PTS_OPEN} pts` : `${PTS_MCQ} pt`;
  let body = "";
  if(warm) body += `<div class="testbanner">🧪 Question test : elle ne compte pas. ${Q.num ? "C'est une question chiffrée : chaque équipe règle son curseur, verrouille, puis on révèle. La plus proche gagne." : "C'est une question à réponse : une équipe sûre d'elle annonce sa réponse, sinon on passe aux 4 propositions."}</div>`;
  body += `<div class="q">${esc(Q.q)}</div>`;

  if(ph==="open"){
    body += `<div class="hint">Une équipe est sûre d'elle ? Elle annonce sa réponse, puis on dévoile. Sinon, on passe aux 4 propositions.</div>
      <div class="row"><button class="primary" data-act="reveal-open">Dévoiler la réponse (${PTS_OPEN} pts)</button><button data-act="mcq">Personne ne sait : 4 propositions (${PTS_MCQ} pt)</button></div>`;
  }
  if(ph==="open-revealed"){
    body += answerBox(Q) + attribution(PTS_OPEN, "Qui avait la bonne réponse ?") + `<div class="row" style="margin-top:12px"><button class="ghost small" style="color:#334155;border-color:#cbd5e1" data-act="mcq">Réponse fausse : passer au QCM pour l'autre équipe</button></div>`;
  }
  if(ph==="mcq"){
    body += `<div class="hint">Chaque équipe choisit une lettre. Puis on révèle.</div>` + choices(Q,false) + `<div class="row"><button class="primary" data-act="reveal-mcq">Révéler la bonne réponse</button></div>`;
  }
  if(ph==="mcq-revealed"){
    body += choices(Q,true) + answerBox(Q) + attribution(PTS_MCQ, "Qui avait choisi la bonne lettre ?");
  }
  if(ph==="num"){
    const both = S.num.lockA && S.num.lockB;
    body += `<div class="hint">Chaque équipe règle son curseur pendant que l'autre regarde ailleurs, puis verrouille. Pour être précis : les boutons ± ou taper le nombre.</div>
      <div class="sliders">${sliderPanel(Q,"A")}${sliderPanel(Q,"B")}</div>
      <div class="row"><button class="primary" data-act="reveal-num" ${both?"":"disabled"}>${both ? "Révéler la réponse" : "Les deux équipes doivent verrouiller"}</button></div>`;
  }
  if(ph==="num-revealed"){
    const a = Q.a, vA = S.num.A, vB = S.num.B, dA = Math.abs(vA-a), dB = Math.abs(vB-a);
    const win = dA<dB ? "A" : dB<dA ? "B" : "both";
    const pct = v => Math.max(0, Math.min(100, (v-Q.num.min)/(Q.num.max-Q.num.min)*100));
    const verdict = win==="both" ? `🤝 Même écart : ${PTS_NUM_TIE} pt chacune` : `🏆 ${esc(S.names[win])} est la plus proche : +${PTS_NUM}`;
    body += `<div class="axis"><div class="track"></div>
        <div class="mk A" style="left:${pct(vA)}%"><span>${esc(fmt(vA,Q))}</span></div>
        <div class="mk B" style="left:${pct(vB)}%"><span>${esc(fmt(vB,Q))}</span></div>
        <div class="mk ans" style="left:${pct(a)}%"></div></div>`
      + answerBox(Q)
      + `<div class="gaps"><div class="gap A ${win!=="B"?"win":""}">${esc(S.names.A)} : ${esc(fmt(vA,Q))} · écart ${dA}</div><div class="gap B ${win!=="A"?"win":""}">${esc(S.names.B)} : ${esc(fmt(vB,Q))} · écart ${dB}</div></div>
        <div class="verdict">${verdict}</div>
        <div class="attr"><div class="row"><button class="primary" data-act="give" data-team="${win}">Valider${warm?" (test, ne compte pas)":""}</button></div>
        <div class="row" style="margin-top:10px"><span style="color:#64748b;font-weight:700">Corriger à la main :</span><button class="teamA small" data-act="give" data-team="A">${esc(S.names.A)}</button><button class="teamB small" data-act="give" data-team="B">${esc(S.names.B)}</button><button class="none small" data-act="give" data-team="none">Personne</button></div></div>`;
  }

  const badge = warm ? `Question test · ${C.label}` : `${C.label} · ${esc(Q.sub)}`;
  app.innerHTML = `${topbar()}${scorebar()}
    <div class="card">
      <div class="hero" style="background:${C.grad}"><span class="badge">${badge}</span><span class="stake">${stake}</span>${Q.emo.map(e=>`<span class="emo">${e}</span>`).join("")}</div>
      <div class="body">${body}</div>
    </div>`;
  bind();
  if(ph==="num") bindSliders(Q);
}

function sliderPanel(Q,t){
  const locked = S.num["lock"+t], v = S.num[t], n = Q.num, big = n.step*10;
  if(locked) return `<div class="sl ${t} locked"><div class="h">${esc(S.names[t])}</div><div class="vv">🔒</div><p style="text-align:center;color:#64748b;font-weight:700">Réponse verrouillée</p><div class="row" style="justify-content:center"><button class="ghost small" style="color:#334155;border-color:#cbd5e1" data-act="unlock" data-team="${t}">Déverrouiller</button></div></div>`;
  return `<div class="sl ${t}"><div class="h">${esc(S.names[t])}</div>
    <div class="vv" id="vv${t}">${esc(fmt(v,Q))}</div>
    <input type="range" id="rg${t}" min="${n.min}" max="${n.max}" step="${n.step}" value="${v}">
    <div class="steps"><button class="stepb" data-t="${t}" data-d="${-big}">−${big}</button><button class="stepb" data-t="${t}" data-d="${-n.step}">−${n.step}</button>
      <input type="number" id="nb${t}" min="${n.min}" max="${n.max}" step="${n.step}" value="${v}">
      <button class="stepb" data-t="${t}" data-d="${n.step}">+${n.step}</button><button class="stepb" data-t="${t}" data-d="${big}">+${big}</button></div>
    <button class="lockb" data-act="lock" data-team="${t}">🔒 Verrouiller</button></div>`;
}

function bindSliders(Q){
  const n = Q.num;
  ["A","B"].forEach(t=>{
    const rg = document.getElementById("rg"+t); if(!rg) return;
    const nb = document.getElementById("nb"+t), vv = document.getElementById("vv"+t);
    const set = x=>{ if(isNaN(x)) x = S.num[t]; x = Math.max(n.min, Math.min(n.max, Math.round(x/n.step)*n.step)); S.num[t]=x; rg.value=x; nb.value=x; vv.textContent=fmt(x,Q); save(); };
    rg.oninput = ()=>set(+rg.value);
    nb.onchange = ()=>set(+nb.value);
    app.querySelectorAll(`.stepb[data-t="${t}"]`).forEach(b=> b.onclick = ()=>set(S.num[t] + (+b.dataset.d)));
  });
}

function bind(){ app.querySelectorAll("[data-act]").forEach(b=> b.onclick = ()=> act(b.dataset.act, b.dataset.team)); }
function answerBox(Q){ return `<div class="answer"><div class="a">✅ ${esc(ansText(Q))}</div><div class="n">${esc(Q.note)}</div></div>`; }
function choices(Q, revealed){
  return `<div class="choices">${Q.choices.map((c,k)=>`<div class="choice ${revealed ? (k===Q.good?"good":"bad") : ""}"><span class="k">${"ABCD"[k]}</span><span>${esc(c)}</span></div>`).join("")}</div>`;
}
function attribution(pts, label){
  const note = S.warm!==null ? " · test, ne compte pas" : "";
  return `<div class="attr"><div class="lab">${label} · ${pts} pt${pts>1?"s":""}${note}</div>
    <div class="row"><button class="teamA" data-act="give" data-team="A">${esc(S.names.A)}</button><button class="teamB" data-act="give" data-team="B">${esc(S.names.B)}</button><button class="none" data-act="give" data-team="none">Personne</button></div></div>`;
}

function act(a, team){
  if(a==="home"){ S.prev = S.screen; S.screen="intro"; render(); return; }
  if(a==="reveal-open"){ S.phase="open-revealed"; render(); return; }
  if(a==="mcq"){ S.phase="mcq"; render(); return; }
  if(a==="reveal-mcq"){ S.phase="mcq-revealed"; render(); return; }
  if(a==="lock"){ S.num["lock"+team]=true; render(); return; }
  if(a==="unlock"){ S.num["lock"+team]=false; render(); return; }
  if(a==="reveal-num"){ if(S.num.lockA && S.num.lockB){ S.phase="num-revealed"; render(); } return; }
  if(a==="undo"){
    const last = S.results.pop();
    if(last){ S.tie = last.tie; if(!last.tie) S.i = last.i; S.warm = null; S.screen="play"; enterQ(); toast("Attribution annulée, on rejoue la question"); render(); }
    return;
  }
  if(a==="give"){
    let pts = S.phase==="open-revealed" ? PTS_OPEN : S.phase==="mcq-revealed" ? PTS_MCQ : (team==="both" ? PTS_NUM_TIE : PTS_NUM);
    if(team==="none") pts = 0;
    const msg = team==="none" ? "Personne ne marque" : team==="both" ? `+${pts} pour chaque équipe` : `+${pts} pour ${S.names[team]}`;
    if(S.warm!==null){
      toast("Test : " + msg + " (ne compte pas)");
      S.warm++;
      if(S.warm>=WARMUP.length){ S.warm=null; S.screen="ready"; } else enterQ();
      render(); return;
    }
    S.results.push({i:S.i, tie:S.tie, team, pts});
    toast(msg);
    if(S.tie){ S.tie=false; S.screen="end"; render(); return; }
    S.i++;
    if(S.i>=QUESTIONS.length) S.screen="end"; else enterQ();
    render();
  }
}

function renderReady(){
  app.className = "end";
  app.innerHTML = `${scorebar()}
    <div class="card">
      <div style="font-size:80px">🎯</div>
      <div class="winner">Échauffement terminé</div>
      <p style="font-size:20px;color:#334155">Les scores sont à zéro. Place aux ${QUESTIONS.length} vraies questions.</p>
      <div class="row" style="justify-content:center;margin-top:22px"><button class="primary" id="go">Lancer la partie 🎲</button><button class="ghost" style="color:#334155;border-color:#cbd5e1" id="rewarm">Refaire les questions test</button></div>
    </div>`;
  document.getElementById("go").onclick = ()=>{ S.i=0; S.results=[]; S.screen="play"; enterQ(); render(); };
  document.getElementById("rewarm").onclick = ()=>{ S.warm=0; S.screen="play"; enterQ(); render(); };
}

function renderEnd(){
  app.className = "end";
  const a=score("A"), b=score("B");
  const tieResult = S.results.find(r=>r.tie);
  let head;
  if(a===b && !tieResult){
    head = `<div class="winner">🤝 Égalité ${a} à ${b}</div><p style="color:#475569;font-size:18px">Une question subsidiaire chiffrée pour départager : le curseur le plus proche l'emporte.</p><div class="row" style="justify-content:center;margin-top:16px"><button class="primary" id="tb">Question subsidiaire 🤸</button></div>`;
  } else {
    const tbWin = tieResult && (tieResult.team==="A"||tieResult.team==="B") ? tieResult.team : null;
    const win = a>b ? "A" : b>a ? "B" : tbWin;
    head = win
      ? `<div class="winner" style="color:var(--team${win})">🏆 ${esc(S.names[win])} l'emporte !</div><p style="font-size:22px;font-weight:800">${a} · ${b}</p>${tieResult && tbWin ? `<p style="color:#475569">Départagés sur la question subsidiaire.</p>` : ""}`
      : `<div class="winner">🤝 Égalité parfaite, même sur la subsidiaire</div><p style="font-size:22px;font-weight:800">${a} · ${b}</p><p style="color:#475569">Le maître du jeu tranche. Ou on remet le couvert.</p>`;
  }
  const recap = S.results.map(r=>{ const Q = r.tie ? TIEBREAK : QUESTIONS[r.i]; const who = r.team==="none" ? "Personne" : r.team==="both" ? `Les deux +${r.pts}` : `${esc(S.names[r.team])} +${r.pts}`; return `<div><span>${r.tie?"★ Subsidiaire":(r.i+1)+"."} ${esc(CATS[Q.cat].label)} · ${esc(ansText(Q))}</span><span class="who ${r.team}">${who}</span></div>`; }).join("");
  app.innerHTML = `${scorebar()}
    <div class="card">
      <h2>Fin de partie</h2>
      ${head}
      <div class="recap">${recap}</div>
      <div class="row" style="justify-content:center;margin-top:22px"><button class="ghost" style="color:#334155;border-color:#cbd5e1" id="undo">↩︎ Corriger la dernière attribution</button><button id="again">Nouvelle partie</button></div>
    </div>`;
  const tb = document.getElementById("tb"); if(tb) tb.onclick = ()=>{ S.tie=true; S.screen="play"; enterQ(); render(); };
  document.getElementById("again").onclick = ()=>{ if(confirm("Effacer les scores et recommencer ?")){ const n=S.names; S=fresh(); S.names=n; S.screen="play"; S.prev="play"; enterQ(); render(); } };
  document.getElementById("undo").onclick = ()=> act("undo");
}

// raccourcis clavier : Entrée = bouton principal, A / B / N = attribution (hors champs de saisie)
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  const k = e.key.toLowerCase();
  if(k==="enter"){ const b=document.querySelector("button.primary:not([disabled])"); if(b){ e.preventDefault(); b.click(); } }
  if(S.screen==="play" && ["open-revealed","mcq-revealed","num-revealed"].includes(S.phase)){
    if(k==="a") act("give","A"); if(k==="b") act("give","B"); if(k==="n") act("give","none");
  }
});

render();
</script>
</body>
</html>
